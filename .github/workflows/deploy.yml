name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main        # cambia a 'master' si tu rama principal se llama así
      - locations   # rama actual del proyecto

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        # La API key se inyecta desde los Secrets del repositorio
        # Nunca toca el código fuente ni el historial de git
        env:
          REACT_APP_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Deploy a GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true
